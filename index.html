<!DOCTYPE html>

<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Fret Trainer Pro</title>
    <style>
        body { margin: 0; background: black; overflow: hidden; touch-action: none; font-family: sans-serif; color: white; }
        body, html {
            margin: 0;
            padding: 0;
            overflow: hidden;
            height: 100%;
            width: 100%;
            background-color: #1a1a1a; /* Dark background for the letterbox effect */
        }

        /* A dedicated overlay that covers the entire game area */
        .overlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            display: flex;
            justify-content: center;
            align-items: center;
            background-color: rgba(0, 0, 0, 0.7); /* Dims the fretboard until start */
            z-index: 100; /* Higher than your ui-layer z-index: 50 */
            transition: opacity 0.5s ease;
        }

        #start-button {
            pointer-events: auto; /* Re-enable clicks for the button itself */
            padding: 15px 40px;
            font-size: 24px;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            font-weight: bold;
            color: #ffffff;
            background: #2c3e50;
            border: 2px solid #3498db;
            border-radius: 8px;
            cursor: pointer;
            transition: all 0.2s ease;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.5);
            text-transform: uppercase;
            letter-spacing: 2px;
        }

        #rubrace {
            background-color: #000;
            box-shadow: 0 0 20px rgba(0,0,0,0.5); /* Adds a slight shadow to define the 'screen' */
        }        
        canvas {
            display: block;            
        }
       
        .ui-layer { 
            position: absolute; 
            bottom: 15px; 
            left: 20px; 
            right: 20px; 
            display: flex; 
            justify-content: space-between; 
            align-items: center; 
            pointer-events: none; 
            z-index: 50; 
        }

        .btn-group { display: flex; gap: 8px; pointer-events: auto; }

        button { 
            padding: 8px 10px; 
            background: #333; 
            color: white; 
            border: 1px solid #555; 
            border-radius: 8px; 
            font-weight: bold; 
            cursor: pointer;
        }
        #menuTrigger {
            position: fixed;
            top: 15px;
            left: 15px;
            z-index: 100;
            background: #444;
            color: white;
            border: none;
            padding: 10px 15px;
            border-radius: 5px;
            font-size: 20px;
            cursor: pointer;
        }
        
        #sideMenu {
            position: fixed;
            top: 0;
            left: -280px; /* Hidden off-screen */
            width: 250px;
            height: 100%;
            background: rgba(30, 30, 30, 0.95);
            color: white;
            transition: 0.3s ease-in-out;
            z-index: 101;
            padding: 15px;
            box-shadow: 2px 0 10px rgba(0,0,0,0.5);
        }
        
        #sideMenu.active {
            left: 0; /* Slide in */
        }
        
        .menu-items button {
            display: block;
            width: 100%;
            padding: 8px;
            margin: 4px 0;
            background: #333;
            color: #ddd;
            border: 1px solid #444;
            text-align: left;
            border-radius: 4px;
            font-size: 12px;
        }
        
        .menu-items button:hover {
            background: #555;
            color: white;
        }
        #optionsMenuPage {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0,0,0,0.95);
            z-index: 1000;
            color: white;
            text-align: center;
            padding-top: 50px;
            pointer-events: auto;
        }

        .option-row { margin: 25px 0; }
        .option-row label { font-size: 1.2em; cursor: pointer; }
        .option-row input { transform: scale(1.6); margin-right: 15px; vertical-align: middle; }

        #app {
            position: fixed;
            top: 50%;
            left: 50%;
            transform-origin: center;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        /* Helper class to remove the screen */
        .hidden {
            display: none !important;
        }        
    </style>
</head>
<body>

<div id="start-screen" class="overlay">
    <button id="start-button">START</button>
</div>

<div id="app">
    <canvas id="rubrace" ></canvas>
</div>

<button id="menuTrigger" onclick="toggleMenu(true)">☰</button>
<div id="sideMenu" class="menu-hidden">
    <div class="menu-header">
        <span>Select Mode</span>
        <button onclick="toggleMenu(false)">✕</button>
    </div>
    <div class="menu-items">
        <button id="optionsBtn" onclick="toggleMenu(false);toggleMenuPage(true);">Options...</button>
    </div>
</div>

<div id="optionsMenuPage">
    <h2>SETTINGS</h2>
    <div class="option-row">
        <label><input type="checkbox" id="debugToggle" onchange="game.showDebug = this.checked"> Show Debug Stats</label>
    </div>
    <div class="option-row">
        <label><input type="checkbox" id="historyToggle" onchange="game.showHistory = this.checked" checked> Show Fretboard Tap History </label>
    </div>

</div>
<script src="rubrace.js?v=1.002"></script>


<script>
let game = null;

async function readyApp() {
    try {

        game = new RubRace(document.getElementById('rubrace'));

        game.draw();

    } catch (err) {
        console.error("Initialization failed:", err);
    }
}



function toggleMenuPage(show) {
    document.getElementById('optionsMenuPage').style.display = show ? 'block' : 'none';
    if (show) {
        document.getElementById('debugToggle').checked = game.showDebug;
        document.getElementById('historyToggle').checked = game.showHistory;
        document.getElementById('permission3D').checked = game.show3D;
    } 
}


function switchGame(type) {
    //if (type === 'section') 
    game.calculate() 
    toggleMenu(false); // Close the drawer after selection
    game.reset();
    localStorage.setItem('lastGame', type);
}

function toggleMenu(isOpen) {
    const menu = document.getElementById('sideMenu');
    if (isOpen) {
        menu.classList.add('active');
    } else {
        menu.classList.remove('active');
    }
}


const startScreen = document.getElementById('start-screen');
const startButton = document.getElementById('start-button');
startButton.addEventListener('click', async () => {

     // Hide the start screen
    startScreen.classList.add('hidden');
    game.draw();

});

readyApp();

// to start a server in command line : python -m http.server 8000
</script>
</body>
</html>
