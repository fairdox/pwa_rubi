<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Fret Trainer Pro</title>
    <style>
        body { margin: 0; background: black; overflow: hidden; touch-action: none; font-family: sans-serif; color: white; }
        body, html {
            margin: 0;
            padding: 0;
            overflow: hidden;
            height: 100%;
            width: 100%;
            background-color: #1a1a1a;
        }

        .overlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            display: flex;
            flex-direction: column; /* Stacks name input above the button if visible */
            justify-content: center;
            align-items: center;
            background-color: rgba(0, 0, 0, 0.7);
            z-index: 100;
            transition: opacity 0.5s ease;
            gap: 20px;
        }

        /* Style for the name prompt container */
        .name-prompt-container {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 10px;
            background: #2c3e50;
            padding: 20px;
            border-radius: 8px;
            border: 1px solid #3498db;
        }

        .name-prompt-container label {
            font-size: 18px;
            font-weight: bold;
        }

        .name-input {
            padding: 8px;
            font-size: 16px;
            border-radius: 4px;
            border: none;
            text-align: center;
            width: 200px;
        }

        .start-button {
            pointer-events: auto;
            padding: 15px 20px;
            font-size: 18px;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            font-weight: bold;
            color: #ffffff;
            background: #2c3e50;
            border: 2px solid #3498db;
            border-radius: 8px;
            cursor: pointer;
            transition: all 0.2s ease;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.5);
            text-transform: uppercase;
            letter-spacing: 2px;
        }

        #rubrace {
            background-color: #000;
            box-shadow: 0 0 20px rgba(0,0,0,0.5);
        }        
        canvas {
            display: block;            
        }
        
        .ui-layer { 
            position: absolute; 
            bottom: 15px; 
            left: 20px; 
            right: 20px; 
            display: flex; 
            justify-content: space-between; 
            align-items: center; 
            pointer-events: none; 
            z-index: 50; 
        }

        .btn-group { display: flex; gap: 8px; pointer-events: auto; }

        button { 
            padding: 8px 10px; 
            background: #333; 
            color: white; 
            border: 1px solid #555; 
            border-radius: 8px; 
            font-weight: bold; 
            cursor: pointer;
        }
        #menuTrigger {
            position: fixed;
            top: 15px;
            left: 15px;
            z-index: 100;
            background: #444;
            color: white;
            border: none;
            padding: 10px 15px;
            border-radius: 5px;
            font-size: 20px;
            cursor: pointer;
        }
        
        #sideMenu {
            position: fixed;
            top: 0;
            left: -280px;
            width: 250px;
            height: 100%;
            background: rgba(30, 30, 30, 0.95);
            color: white;
            transition: 0.3s ease-in-out;
            z-index: 101;
            padding: 15px;
            box-shadow: 2px 0 10px rgba(0,0,0,0.5);
        }
        
        #sideMenu.active {
            left: 0;
        }
        
        .menu-items button {
            display: block;
            width: 100%;
            padding: 8px;
            margin: 4px 0;
            background: #333;
            color: #ddd;
            border: 1px solid #444;
            text-align: left;
            border-radius: 4px;
            font-size: 12px;
        }
        
        .menu-items button:hover {
            background: #555;
            color: white;
        }
        #optionsMenuPage {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0,0,0,0.95);
            z-index: 1000;
            color: white;
            text-align: center;
            padding-top: 50px;
            pointer-events: auto;
        }

        .option-row { margin: 25px 0; }
        .option-row label { font-size: 1.2em; cursor: pointer; display: block; margin-bottom: 8px; }
        .option-row input[type="checkbox"] { transform: scale(1.6); margin-right: 15px; vertical-align: middle; }
        .option-row input[type="text"] { padding: 8px; font-size: 16px; border-radius: 4px; border: 1px solid #555; background: #222; color: white; text-align: center; }

        #app {
            position: fixed;
            top: 50%;
            left: 50%;
            transform-origin: center;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .hidden {
            display: none !important;
        }        
    </style>
</head>
<body>

<div id="start-screen" class="overlay">
    <div id="initial-name-box" class="name-prompt-container hidden">
        <label for="initial-name-input">Enter Player Name:</label>
        <input type="text" id="initial-name-input" class="name-input" placeholder="Player Name">
    </div>
    <button class="start-button" id="startMP-button">Multiplayer</button>
    <button class="start-button" id="startSP-button">Single Player</button>

</div>

<div id="app">
    <canvas id="rubrace"></canvas>
</div>

<button id="menuTrigger" onclick="toggleMenu(true)">☰</button>
<div id="sideMenu" class="menu-hidden">
    <div class="menu-header">
        <span>Select Mode</span>
        <button onclick="toggleMenu(false)">✕</button>
    </div>
    <div class="menu-items">
        <button id="optionsBtn" onclick="toggleMenu(false);toggleMenuPage(true);">Options...</button>
    </div>
</div>

<div id="optionsMenuPage">
    <h2>SETTINGS</h2>
    
    <div class="option-row">
        <label for="settings-name-input">Player Name:</label>
        <input type="text" id="settings-name-input" placeholder="Player Name">
    </div>

    <div class="option-row">
        <button onclick="saveSettingsName();toggleMenuPage(false);">Save & Close</button>
    </div>
</div>

<script src="Keyhelper.js?v=1.002"></script>
<script src="gameClient.js?v=1.002"></script>
<script src="rubrace.js?v=1.003"></script>

<script>
let game = null;

async function readyApp() {
    try {
        game = new RubRace(document.getElementById('rubrace'));
        
    } catch (err) {
        console.error("Initialization failed:", err);
    }
}

function checkStoredPlayerName() {
    const savedName = localStorage.getItem("playerName");
    const nameBox = document.getElementById("initial-name-box");
    
    if (!savedName || savedName.trim() === "") {
        // Show the input field box on the start screen overlay
        nameBox.classList.remove("hidden");
    }
}

function toggleMenuPage(show) {
    document.getElementById('optionsMenuPage').style.display = show ? 'block' : 'none';
    if (show) {
        // Sync setting page fields
        const savedName = localStorage.getItem("playerName") || "Player";
        document.getElementById("settings-name-input").value = savedName;

        if (document.getElementById('debugToggle')) document.getElementById('debugToggle').checked = game.showDebug;
        if (document.getElementById('historyToggle')) document.getElementById('historyToggle').checked = game.showHistory;
        if (document.getElementById('permission3D')) document.getElementById('permission3D').checked = game.show3D;
    } 
}

function saveSettingsName() {
    const nameInput = document.getElementById("settings-name-input");
    const newName = nameInput.value.trim();
    
    if (newName !== "") {
        localStorage.setItem("playerName", newName);
        console.log("Player name updated in settings to: " + newName);
        
        // Notify your gameClient instance if it is currently active
        if (gameClient && typeof gameClient.init === "function") {
            gameClient.playerName = newName;
        }
    }
}

function toggleMenu(isOpen) {
    const menu = document.getElementById('sideMenu');
    if (isOpen) {
        menu.classList.add('active');
    } else {
        menu.classList.remove('active');
    }
}

const startScreen = document.getElementById('start-screen');
const startMPButton = document.getElementById('startMP-button');
const startSPButton = document.getElementById('startSP-button');

startMPButton.addEventListener('click', async () => {
    checkStoredPlayerName();
    let activeName = localStorage.getItem("playerName");
    const initialInput = document.getElementById("initial-name-input");

    // If name is not stored, validate the input field
    if (!activeName || activeName.trim() === "") {
        const structuralName = initialInput.value.trim();
        if (structuralName === "") {
            alert("Please enter a valid player name to start.");
            return;
        }
        localStorage.setItem("playerName", structuralName);
        activeName = structuralName;
    }

    // Hide the start screen
    startScreen.classList.add('hidden');
    game.init(true,"ws://localhost:8765", activeName);
});

startSPButton.addEventListener('click', async () => {
    // For single player, we can just hide the start screen and initialize the game without connecting to a server
    startScreen.classList.add('hidden');
    game.init();
});


readyApp();
</script>
</body>
</html>
